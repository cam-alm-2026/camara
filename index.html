<style>
:root{--bg:#0f1115;--card:#181b22;--txt:#e8eaed;--mut:#9aa0a6;--acc:#3b82f6;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 12px 24px}
h1{font-size:20px;margin:20px 0 12px}h2{font-size:15px;color:var(--mut);margin:22px 0 8px}
label{display:block;margin:10px 0;font-size:14px;color:var(--mut)}
input:not([type=checkbox]):not([type=range]){display:block;width:100%;margin-top:4px;padding:12px;border-radius:10px;border:1px solid #2a2f3a;background:var(--card);color:var(--txt);font-size:16px}

input[type=range]{flex:1}

#pb{display:none;font-size:14px;color:#fbbf24;margin:6px 0}

.chips button{padding:8px 10px;font-size:14px;background:#2a2f3a}
.chips button.ev{background:#7f1d1d}
select,input[type=time]{font-size:16px;padding:10px;border-radius:10px;border:1px solid #2a2f3a;background:var(--card);color:var(--txt)}
.small{font-size:13px;color:var(--mut)}
#msg{font-size:13px;color:var(--bad);min-height:18px}
.note{font-size:12px;color:var(--mut);margin:-4px 0 8px 26px}
</style>
</head>
<body>

<section id="login">
  <h1>🔒 Cámara cifrada</h1>
  <label>Broker (WebSocket seguro)<input id="host" value="wss://mqtt.flespi.io" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label>Token flespi del visor<input id="user" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label>Contraseña MQTT (en flespi déjala vacía)<input id="mpass" type="password" autocomplete="off"></label>
  <label>ID de la cámara<input id="dev" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label>Frase secreta<input id="phrase" type="password" autocomplete="off"></label>
  <label class="chk"><input type="checkbox" id="remember"> Recordar broker e ID (nunca token ni claves)</label>

  <p class="note">Solo en tu móvil personal y con bloqueo de pantalla. Las claves se guardan de forma que ninguna página ni app pueda extraerlas, pero cualquiera con tu móvil desbloqueado podrá ver la cámara.</p>
  <button id="go">Conectar</button>
  <p class="err" id="lerr"></p>

  <div class="video"><img id="cam" alt=""><div id="ph">Esperando vídeo…</div></div>
  <div id="pb"></div>

  <div id="msg"></div>
  <div class="row">

    <span id="angv">90°</span>

  </div>
  <div class="row"><label class="chk"><input type="checkbox" id="armed"> Alarma armada</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="conf"> Confirmar movimiento con la cámara (menos falsas alarmas)</label></div>
  <div class="row"><span>💡 Flash</span><input type="range" id="flash" min="0" max="100" step="10" value="0"><span id="flv">0 %</span><button class="sec" id="floff">Apagar</button></div>

    <input type="time" id="ptime" step="1" value="00:00:00">
    <select id="speed"><option value="1">x1</option><option value="2">x2</option><option value="4">x4</option><option value="8">x8</option></select>
    <button id="pgo">▶ Reproducir</button>
  </div>
  <h2>Última alerta</h2>
  <img id="alert" alt="">

  <div class="row"><button class="sec" id="logout">Cerrar sesión</button></div>
</section>

<script>
'use strict';
// Evita que la página se cargue dentro de otra (clickjacking)
if (window.top !== window.self) { document.body.textContent = ''; throw new Error('framed'); }
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const T_FRAME = 1, T_STATUS = 2, T_ALERT = 3, T_CMD = 0x10;
let keys = null, mq = null, topics = null, remembered = false, devId = '';
let mode = 'live', playLastTs = 0, playSpeed = 1, recDay = '';
let lastFrameTs = 0, lastAlertTs = 0, frames = 0, lastCmdTs = 0;
let status = null, lastStatusTs = 0, online = null, dragging = false, frameBlob = null, hiddenAt = 0;
const urls = {};

// ---------- utilidades binarias ----------
function cat(...a) { let n = 0; for (const x of a) n += x.length; const o = new Uint8Array(n); let p = 0; for (const x of a) { o.set(x, p); p += x.length; } return o; }
function mstr(s) { const b = enc.encode(s); return cat(new Uint8Array([b.length >> 8, b.length & 255]), b); }
function rlen(n) { const o = []; do { let d = n % 128; n = Math.floor(n / 128); if (n > 0) d |= 128; o.push(d); } while (n > 0); return new Uint8Array(o); }
function pkt(h, body) { return cat(new Uint8Array([h]), rlen(body.length), body); }
function fmt(ts) { return new Date(ts).toLocaleString('es-ES'); }

// ---------- cliente MQTT 3.1.1 mínimo sobre WebSocket seguro (sin dependencias) ----------
class Mqtt {
  constructor(url, user, pass, subs, onMsg, onState) {
    Object.assign(this, { url, user, pass, subs, onMsg, onState });
    this.stop = false; this.err = ''; this.open();
  }
  open() {
    this.buf = new Uint8Array(0); this.ok = false;
    this.ws = new WebSocket(this.url, 'mqtt');
    this.ws.binaryType = 'arraybuffer';
    this.ws.onopen = () => {
      const rnd = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => b.toString(16).padStart(2, '0')).join('');
      const flags = this.pass ? 0xC2 : 0x82;
      this.ws.send(pkt(0x10, cat(mstr('MQTT'), new Uint8Array([4, flags, 0, 60]), mstr('visor-' + rnd), mstr(this.user), this.pass ? mstr(this.pass) : new Uint8Array(0))));
    };
    this.ws.onmessage = e => this.feed(new Uint8Array(e.data));
    this.ws.onclose = () => {
      this.ok = false; clearInterval(this.ping); this.onState(false, this.err);
      if (!this.stop) setTimeout(() => this.open(), 3000);
    };
    this.ws.onerror = () => {};
  }
  close() { this.stop = true; try { this.ws.send(new Uint8Array([0xE0, 0])); } catch (e) {} this.ws.close(); }
  send(b) { if (this.ws.readyState === 1) this.ws.send(b); }
  publish(topic, payload) { this.send(pkt(0x30, cat(mstr(topic), payload))); }
  feed(chunk) {
    this.buf = this.buf.length ? cat(this.buf, chunk) : chunk;
    for (;;) {
      const b = this.buf; if (b.length < 2) return;
      let len = 0, mul = 1, i = 1, c;
      do { if (i >= b.length) return; c = b[i++]; len += (c & 127) * mul; mul *= 128; } while (c & 128);
      if (b.length < i + len) return;
      const h = b[0], body = b.slice(i, i + len);
      this.buf = b.slice(i + len);
      this.handle(h, body);
    }
  }
  handle(h, body) {
    const t = h >> 4;
    if (t === 2) {                                   // CONNACK
      if (body[1] !== 0) { this.stop = true; this.err = 'Token o contraseña MQTT incorrectos'; this.ws.close(); return; }
      this.ok = true; this.err = '';
      let s = new Uint8Array(0);
      for (const x of this.subs) s = cat(s, mstr(x), new Uint8Array([0]));
      this.send(pkt(0x82, cat(new Uint8Array([0, 1]), s)));
      this.ping = setInterval(() => this.send(new Uint8Array([0xC0, 0])), 30000);
      this.onState(true);
    } else if (t === 3) {                            // PUBLISH
      const q = (h >> 1) & 3, tl = (body[0] << 8) | body[1];
      const topic = dec.decode(body.subarray(2, 2 + tl));
      let p = 2 + tl;
      if (q > 0) { this.send(new Uint8Array([0x40, 2, body[p], body[p + 1]])); p += 2; }
      this.onMsg(topic, body.subarray(p));
    }
  }
}

// ---------- criptografía E2E (WebCrypto) ----------
async function derive(phrase, dev) {
  const base = await crypto.subtle.importKey('raw', enc.encode(phrase.normalize('NFC')), 'PBKDF2', false, ['deriveBits']);
  const master = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc.encode('espcam-v1:' + dev), iterations: 600000, hash: 'SHA-256' }, base, 256);
  const hk = await crypto.subtle.importKey('raw', master, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  const kv = await crypto.subtle.sign('HMAC', hk, enc.encode('video'));
  const kc = await crypto.subtle.sign('HMAC', hk, enc.encode('cmd'));
  return {
    video: await crypto.subtle.importKey('raw', kv, 'AES-GCM', false, ['decrypt']),
    cmd: await crypto.subtle.importKey('raw', kc, 'AES-GCM', false, ['encrypt']),
    rec: await crypto.subtle.importKey('raw', await crypto.subtle.sign('HMAC', hk, enc.encode('rec')), 'AES-GCM', false, ['decrypt'])
  };
}

async function openWith(key, aad, m) {
  if (m.length < 38 || m[0] !== 1) throw new Error('formato');
  const pt = new Uint8Array(await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: m.slice(1, 13), additionalData: enc.encode(aad), tagLength: 128 }, key, m.slice(13)));
  return { ts: Number(new DataView(pt.buffer).getBigUint64(0)), type: pt[8], data: pt.slice(9) };
}
const openMsg = (topic, m) => openWith(keys.video, topic, m);
const T_LIST = 4;

async function sendCmd(obj) {
  if (!mq || !mq.ok) return;
  const ts = Math.max(Date.now(), lastCmdTs + 1); lastCmdTs = ts;
  const j = enc.encode(JSON.stringify(obj));
  const pt = new Uint8Array(9 + j.length);
  new DataView(pt.buffer).setBigUint64(0, BigInt(ts)); pt[8] = T_CMD; pt.set(j, 9);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt(
    { name: 'AES-GCM', iv, additionalData: enc.encode(topics.cmd), tagLength: 128 }, keys.cmd, pt));
  mq.publish(topics.cmd, cat(new Uint8Array([1]), iv, ct));
}

// ---------- interfaz ----------
function showImg(img, data, k) {
  const blob = new Blob([data], { type: 'image/jpeg' });
  const url = URL.createObjectURL(blob), old = urls[k];
  img.src = url; urls[k] = url;
  if (old) setTimeout(() => URL.revokeObjectURL(old), 1000);
  return blob;
}

function renderStatus() {
  // "En línea" se deduce del estado CIFRADO y reciente; el topic /o no está autenticado y solo es una pista
  const age = lastStatusTs ? Math.round((Date.now() - lastStatusTs) / 1000) : null;
  const fresh = age !== null && age < 75;
  const p = [fresh ? '🟢 Cámara en línea' : (online === false ? '🔴 Cámara desconectada' : '🟠 Sin datos recientes de la cámara')];
  if (age !== null) p.push('estado de hace ' + age + ' s');
  if (status) {
    p.push(status.armed ? 'Alarma armada' : 'Alarma desarmada');
    p.push('WiFi ' + status.rssi + ' dBm');
    if (status.nt) p.push('🌙 Modo noche');
    p.push(status.sd >= 0 ? ('SD: ' + (status.sd / 1024).toFixed(1) + ' GB libres' + (status.rec ? ' · grabando' : '')) : 'Sin tarjeta SD');
    $('conf').checked = !!status.cf;
    if (!flDragging) { $('flash').value = status.fl || 0; $('flv').textContent = (status.fl || 0) + ' %'; }
    p.push(status.motion ? 'Último movimiento: ' + fmt(status.motion) : 'Sin movimiento registrado');
    $('armed').checked = !!status.armed;
    if (!dragging) { $('ang').value = status.angle; $('angv').textContent = status.angle + '°'; }
  }
  $('st').textContent = p.join(' · ');
}

function pad2(n) { return String(n).padStart(2, '0'); }
function dayLabel(d) { return d.slice(6, 8) + '/' + d.slice(4, 6) + '/' + d.slice(0, 4); }

function renderList(j) {
  if (j.nosd) { $('recinfo').textContent = 'La cámara no tiene tarjeta SD.'; return; }
  if (j.end) {
    $('pb').textContent = j.empty ? '⏹ No hay grabación a partir de esa hora.' : '⏹ Fin de la grabación.';
    return;
  }
  if (j.days) {
    const sel = $('days'); sel.textContent = '';
    if (!j.days.length) { $('recinfo').textContent = 'Todavía no hay grabaciones.'; sel.hidden = true; return; }
    for (const d of j.days.slice().reverse()) { const o = document.createElement('option'); o.value = d; o.textContent = dayLabel(d); sel.appendChild(o); }
    sel.hidden = false; $('recinfo').textContent = j.days.length + ' días grabados. Elige uno.';
    sel.onchange(); return;
  }
  if (j.d) {
    recDay = j.d;
    $('recinfo').textContent = dayLabel(j.d) + ': ' + (j.ev.length ? j.ev.length + ' eventos (rojo). ' : 'sin eventos. ') + 'Toca un evento o una hora.';
    const evs = $('evs'); evs.textContent = '';
    for (const e of j.ev.slice().reverse().slice(0, 60)) {
      const b = document.createElement('button'); b.className = 'ev';
      b.textContent = '🚨 ' + e.slice(0, 2) + ':' + e.slice(2, 4) + ':' + e.slice(4, 6);
      b.onclick = () => startPlay(recDay, e, 5);
      evs.appendChild(b);
    }
    const hs = $('hours'); hs.textContent = '';
    for (const h of j.h) {
      const b = document.createElement('button'); b.textContent = pad2(h) + ':00';
      b.onclick = () => startPlay(recDay, pad2(h) + '0000', 0);
      hs.appendChild(b);
    }
    $('playrow').hidden = false;
  }
}

function startPlay(day, hhmmss, backSeconds) {
  let t = (+hhmmss.slice(0, 2)) * 3600 + (+hhmmss.slice(2, 4)) * 60 + (+hhmmss.slice(4, 6)) - backSeconds;
  if (t < 0) t = 0;
  const tt = pad2(Math.floor(t / 3600)) + pad2(Math.floor(t / 60) % 60) + pad2(t % 60);
  playSpeed = +$('speed').value || 1;
  mode = 'play'; playLastTs = 0;
  $('pb').style.display = 'block';
  $('pb').textContent = '▶ Cargando grabación…';
  $('back').hidden = false;
  sendCmd({ c: 'play', d: day, t: tt, a: playSpeed });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function backToLive() {
  sendCmd({ c: 'stop' });
  mode = 'live'; lastFrameTs = 0;
  $('pb').style.display = 'none'; $('back').hidden = true;
}

async function onMsg(topic, m) {
  if (topic === topics.online) { online = dec.decode(m) === '1'; renderStatus(); return; }
  if (topic === topics.play) {
    if (mode !== 'play') return;
    let r;
    try { r = await openWith(keys.rec, 'rec:' + devId, m); }
    catch (e) { $('msg').textContent = '⚠️ Grabación que no se puede descifrar (frase o ID distintos, o datos manipulados).'; return; }
    if (r.type !== T_FRAME || r.ts <= playLastTs) return;
    playLastTs = r.ts;
    frameBlob = showImg($('cam'), r.data, 'cam'); $('ph').hidden = true;
    $('pb').textContent = '▶ Grabación ' + fmt(r.ts) + ' · x' + playSpeed;
    return;
  }
  let r;
  try { r = await openMsg(topic, m); }
  catch (e) { $('msg').textContent = '⚠️ Mensaje que no se puede descifrar: frase secreta o ID incorrectos, o datos manipulados.'; return; }
  $('msg').textContent = '';
  if (topic === topics.list && r.type === T_LIST) {
    if (Date.now() - r.ts > 60000) return;
    try { renderList(JSON.parse(dec.decode(r.data))); } catch (e) {}
    return;
  }
  if (topic === topics.video && r.type === T_FRAME) {
    if (mode !== 'live') return;
    if (r.ts <= lastFrameTs) return;               // descarta repetidos o desordenados
    if (Date.now() - r.ts > 30000) { $('msg').textContent = '⚠️ Fotograma antiguo descartado (posible repetición o reloj desajustado).'; return; }
    lastFrameTs = r.ts; frames++;
    frameBlob = showImg($('cam'), r.data, 'cam'); $('ph').hidden = true;
  } else if (topic === topics.status && r.type === T_STATUS) {
    if (r.ts <= lastStatusTs) return;              // no acepta estados más antiguos (repetición)
    lastStatusTs = r.ts; status = JSON.parse(dec.decode(r.data)); renderStatus();
  } else if (topic === topics.alert && r.type === T_ALERT) {
    if (r.ts <= lastAlertTs) return;
    lastAlertTs = r.ts;
    showImg($('alert'), r.data, 'alert'); $('alertt').textContent = '🚨 ' + fmt(r.ts);
  }
}

function onState(ok, err) {
  $('dot').style.background = ok ? 'var(--ok)' : 'var(--bad)';
  $('conn').textContent = ok ? 'Conectado · cifrado E2E' : (err || 'Reconectando…');
  if (ok) sendCmd({ c: 'watch' });
}

function servo(a) {
  a = Math.max(0, Math.min(180, Math.round(a)));
  $('ang').value = a; $('angv').textContent = a + '°';
  sendCmd({ c: 'servo', a });
}

// ---------- "Recordar en este dispositivo": IndexedDB con claves NO extraíbles ----------
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('espcam', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('kv', mode), req = fn(tx.objectStore('kv'));
    tx.oncomplete = () => { db.close(); res(req && req.result); };
    tx.onerror = tx.onabort = () => { db.close(); rej(tx.error); };
  });
}
const idbGet = k => idbDo('readonly', st => st.get(k));
const idbPut = (k, v) => idbDo('readwrite', st => st.put(v, k));
const idbClear = () => idbDo('readwrite', st => st.clear());

async function persistDevice(host, user, dev) {
  // El token se cifra con una clave AES propia, también no extraíble
  const wrap = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, wrap, enc.encode(user)));
  await idbPut('cfg', { v: 2, host, dev, video: keys.video, cmd: keys.cmd, rec: keys.rec, wrap, iv, ct });
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

function startSession(host, user, pass, dev) {
  const b = 'espcam/' + dev;
  devId = dev;
  topics = { video: b + '/v', status: b + '/s', alert: b + '/a', cmd: b + '/c', online: b + '/o', list: b + '/l', play: b + '/p' };
  $('login').hidden = true; $('app').hidden = false;
  $('logout').textContent = remembered ? 'Olvidar este dispositivo' : 'Cerrar sesión';
  mq = new Mqtt(host, user, pass, [topics.video, topics.status, topics.alert, topics.online, topics.list, topics.play], onMsg, onState);
}

$('go').onclick = async () => {
  if (!window.isSecureContext || !crypto.subtle) { $('lerr').textContent = 'Abre el visor por HTTPS.'; return; }
  let host = $('host').value.trim();
  if (!/^[a-z]+:\/\//i.test(host)) host = 'wss://' + host;
  const user = $('user').value.trim(), pass = $('mpass').value, dev = $('dev').value.trim(), phrase = $('phrase').value;
  if (!/^wss:\/\/[^\s]+$/i.test(host)) { $('lerr').textContent = 'El broker debe empezar por wss:// (conexión cifrada).'; return; }
  if (!user) { $('lerr').textContent = 'Falta el token del broker.'; return; }
  if (!/^[0-9A-Za-z]{16,}$/.test(dev)) { $('lerr').textContent = 'El ID debe tener 16+ letras o números.'; return; }
  if (phrase.length < 20) { $('lerr').textContent = 'La frase secreta debe tener 20+ caracteres.'; return; }
  $('go').disabled = true; $('lerr').textContent = 'Derivando claves…';
  try { keys = await derive(phrase, dev); } catch (e) { $('lerr').textContent = 'Error de cifrado: ' + e.message; $('go').disabled = false; return; }
  $('phrase').value = ''; $('mpass').value = ''; $('user').value = '';
  try {
    if ($('remember').checked) localStorage.setItem('cam', JSON.stringify({ host, dev }));
    else localStorage.removeItem('cam');
  } catch (e) {}
  if ($('persist').checked) {
    if (pass) { $('lerr').textContent = 'Para recordar el dispositivo, usa un token sin contraseña (flespi).'; $('go').disabled = false; return; }
    try { await persistDevice(host, user, dev); remembered = true; }
    catch (e) { $('lerr').textContent = 'Este navegador no permite recordar de forma segura. Se conectará sin recordar.'; }
  }
  startSession(host, user, pass, dev);
};

document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => servo(+$('ang').value + +b.dataset.d));
$('center').onclick = () => servo(90);
let flDragging = false;
$('flash').oninput = () => { flDragging = true; $('flv').textContent = $('flash').value + ' %'; };
$('flash').onchange = () => { flDragging = false; sendCmd({ c: 'flash', a: +$('flash').value }); };
$('floff').onclick = () => { $('flash').value = 0; $('flv').textContent = '0 %'; sendCmd({ c: 'flash', a: 0 }); };
$('conf').onchange = () => sendCmd({ c: 'conf', a: $('conf').checked ? 1 : 0 });
$('recload').onclick = () => { $('recinfo').textContent = 'Consultando la tarjeta…'; sendCmd({ c: 'days' }); };
$('days').onchange = () => { if ($('days').value) sendCmd({ c: 'day', d: $('days').value }); };
$('pgo').onclick = () => { const v = ($('ptime').value || '00:00:00').replace(/:/g, ''); if (recDay) startPlay(recDay, (v + '00').slice(0, 6), 0); };
$('back').onclick = backToLive;
$('ang').oninput = () => { dragging = true; $('angv').textContent = $('ang').value + '°'; };
$('ang').onchange = () => { dragging = false; servo(+$('ang').value); };
$('armed').onchange = () => sendCmd({ c: 'arm', a: $('armed').checked ? 1 : 0 });
$('save').onclick = () => {
  if (!frameBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(frameBlob);
  a.download = 'camara-' + new Date().toISOString().replace(/[:.]/g, '-') + '.jpg';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
};
$('logout').onclick = async () => {
  if (remembered) {
    if (!confirm('Se borrarán de este dispositivo las claves y el token. ¿Continuar?')) return;
    try { await idbClear(); } catch (e) {}
  }
  if (mq) mq.close(); keys = null; location.reload();
};

// Latido: la cámara solo emite vídeo mientras el visor está visible
setInterval(() => { if (document.visibilityState === 'visible') sendCmd({ c: 'watch' }); }, 5000);
// Bloqueo automático: tras 10 min en segundo plano se borran las claves de memoria
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { hiddenAt = Date.now(); return; }
  // Tras 10 min en segundo plano: sin "recordar" se borran las claves de memoria;
  // con "recordar" se reconecta desde cero (las claves siguen en el almacén seguro)
  if (keys && hiddenAt && Date.now() - hiddenAt > 600000) { if (mq) mq.close(); keys = null; location.reload(); return; }
  sendCmd({ c: 'watch' });
});
setInterval(() => { if (topics) renderStatus(); }, 5000);
setInterval(() => {
  if (!topics) return;
  const lag = lastFrameTs ? Math.max(0, (Date.now() - lastFrameTs) / 1000) : 0;
  $('fps').textContent = frames + ' fps' + (lastFrameTs && lag > 5 ? ' · sin vídeo hace ' + Math.round(lag) + ' s' : '');
  frames = 0;
}, 1000);

try {
  const s = JSON.parse(localStorage.getItem('cam') || 'null');
  if (s) { if (s.host) $('host').value = s.host; $('dev').value = s.dev || ''; $('remember').checked = true; }
} catch (e) {}

// Arranque automático si este dispositivo está recordado
(async () => {
  try {
    if (!window.isSecureContext || !crypto.subtle || !window.indexedDB) return;
    const c = await idbGet('cfg');
    if (!c || c.v !== 2) return;
    const user = dec.decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: c.iv }, c.wrap, c.ct));
    keys = { video: c.video, cmd: c.cmd, rec: c.rec };
    remembered = true;
    startSession(c.host, user, '', c.dev);
  } catch (e) {
    $('lerr').textContent = 'No se pudo abrir la configuración guardada. Vuelve a introducir los datos.';
  }
})();
</script>
</body>
</html>
